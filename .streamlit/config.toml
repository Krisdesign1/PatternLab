# PatternLab : surfaces claires, bleu profond et typographie système.
# Les variantes restent disponibles dans le menu de l’application.
[theme]
base = "light"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["28px", "24px", "20px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
codeFontSize = "14px"
linkUnderline = true

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6FB"
textColor = "#17253F"
borderColor = "#D9E2EF"
dataframeBorderColor = "#D9E2EF"
dataframeHeaderBackgroundColor = "#EDF2F9"
linkColor = "#1D4ED8"
codeTextColor = "#17253F"
codeBackgroundColor = "#F3F6FB"
blueColor = "#1D4ED8"
greenColor = "#0F766E"
redColor = "#B42318"
orangeColor = "#B45309"
yellowColor = "#927214"
violetColor = "#6D48B5"
grayColor = "#64748B"
chartCategoricalColors = ["#1D4ED8", "#0F766E", "#B45309", "#6D48B5", "#64748B", "#BE355A"]
chartSequentialColors = ["#F3F6FB", "#E5EDFB", "#CDDDFC", "#ADC7FA", "#83A8F3", "#5B86E6", "#3866D5", "#244DB6", "#1B3C91", "#172D67"]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDF3FC"
textColor = "#17253F"
borderColor = "#D9E2EF"
primaryColor = "#1D4ED8"
linkColor = "#1D4ED8"
codeBackgroundColor = "#F3F6FB"
dataframeHeaderBackgroundColor = "#EDF2F9"

[theme.dark]
primaryColor = "#2563EB"
backgroundColor = "#111C30"
secondaryBackgroundColor = "#1D2B43"
textColor = "#F1F5FB"
borderColor = "#41516B"
dataframeBorderColor = "#41516B"
dataframeHeaderBackgroundColor = "#24334D"
linkColor = "#93C5FD"
codeTextColor = "#E2EAF6"
codeBackgroundColor = "#1D2B43"
blueColor = "#93C5FD"
greenColor = "#5EEAD4"
redColor = "#FDA4AF"
orangeColor = "#FDBA74"
yellowColor = "#FDE68A"
violetColor = "#C4B5FD"
grayColor = "#A7B5CC"
chartCategoricalColors = ["#93C5FD", "#5EEAD4", "#FDBA74", "#C4B5FD", "#A7B5CC", "#FDA4AF"]
chartSequentialColors = ["#172D67", "#1B3C91", "#244DB6", "#3866D5", "#5B86E6", "#83A8F3", "#ADC7FA", "#CDDDFC", "#E5EDFB", "#F3F6FB"]

[theme.dark.sidebar]
backgroundColor = "#142138"
secondaryBackgroundColor = "#22334F"
textColor = "#F1F5FB"
borderColor = "#41516B"
primaryColor = "#2563EB"
linkColor = "#93C5FD"
codeBackgroundColor = "#1D2B43"
dataframeHeaderBackgroundColor = "#24334D"
