[Unit]
Wants=patternlab-google-auth-proxy.service
After=patternlab-google-auth-proxy.service

[Service]
# Keep the existing loopback-only IPAddressAllow/Deny policy.
# Only the Google OIDC proxy has external connectivity.
Environment=HTTPS_PROXY=http://127.0.0.1:18081
Environment=HTTP_PROXY=http://127.0.0.1:18081
Environment=NO_PROXY=127.0.0.1,localhost,::1
