name: Cycle Cloud gratuit

on:
  workflow_dispatch:
  schedule:
    # 00:17, 08:17 et 16:17 à Kinshasa (UTC+1), trois passages par jour.
    - cron: '17 7,15,23 * * *'

permissions:
  contents: read

concurrency:
  group: patternlab-cloud-automation
  cancel-in-progress: false

jobs:
  bounded-cycle:
    if: vars.PATTERNLAB_CLOUD_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PATTERNLAB_DATABASE_URL: ${{ secrets.PATTERNLAB_DATABASE_URL }}
      PATTERNLAB_CLOUD_REQUIRED: 'true'
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PATTERNLAB_WORKSPACE: ${{ vars.PATTERNLAB_WORKSPACE || 'patternlab-main' }}
    steps:
      # Full SHAs verified against the official action repositories.
      - name: Lire le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Préparer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Vérifier le stockage sans appel API-Football
        run: python scripts/cloud_workspace.py check
      - name: Exécuter le cycle sans entraînement
        run: python scripts/cloud_workspace.py run
