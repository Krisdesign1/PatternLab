name: Vérifications PatternLab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patternlab_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: patternlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patternlab_test -d patternlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PATTERNLAB_DATABASE_URL: ''
      PATTERNLAB_CLOUD_REQUIRED: 'false'
      PATTERNLAB_TEST_POSTGRES_DSN: postgresql://patternlab_test:isolated-test-only@127.0.0.1:5432/patternlab_test?sslmode=disable
    steps:
      - name: Lire le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Préparer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Vérifier les dépendances
        run: python -m pip check
      - name: Tester sans données ni secrets de production
        run: python -m unittest discover -q
      - name: Vérifier les préférences des tableaux dans le navigateur
        run: node --test test_table_view_editor.mjs
